{% extends "shop/home.html" %}

{% block content %}
<h1 style="text-align:center; margin-bottom:20px;">Orders</h1>

<table style="width:80%; margin:auto; border-collapse: collapse; font-family:Arial, sans-serif; box-shadow:0 0 10px rgba(0,0,0,0.1);">
  <tr style="background:#2196F3; color:white; text-align:center; height:40px;">
    <th>User</th>
    <th>Total</th>
    <th>Status</th>
    <th>Date</th>
  </tr>
  {% for o in orders %}
  <tr style="border-bottom:1px solid #ddd; transition:background 0.3s;" 
      onmouseover="this.style.background='#f1f1f1';" 
      onmouseout="this.style.background='white';">
    <td style="padding:10px; text-align:center;">{{ o.user.username }}</td>
    <td style="padding:10px; text-align:center;">${{ o.total }}</td>
    <td style="padding:10px; text-align:center;">{{ o.status }}</td>
    <td style="padding:10px; text-align:center;">{{ o.created_at }}</td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="4" style="text-align:center; padding:15px;">No orders yet.</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Django App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f9fb;
            text-align: center;
            padding-top: 80px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
        }
        .links {

            background: #0056b3;
        }

</head>
<body>
    <h1>Welcome to My Django Project</h1>

    </div>

</html>
